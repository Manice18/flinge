[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "flinge"
version = "0.1.0"
description = "Train a MaleCNS-inspired fly brain to hinge — dopamine dating simulation"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "Pillow>=10.0",
  "pydantic>=2.0",
  "python-dotenv>=1.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "openai>=1.40",
  "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
flinge = "flinge.cli:main"

[tool.setuptools.packages.find]
include = ["flinge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
